[package]
name = "me-stow"
description = "Simple configuration files management that use symlink (like gnu stow) but with some changes"
authors = ["ddd"]
homepage = "https://github.com/dddGR"
version = "0.1.0"
repository = "https://github.com/dddGR/me-stow"
readme = "README.md"
edition = "2024"

[dependencies]
clap = { version = "4.5.60", features = ["derive"] }
toml = { version = "1.0.6", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
dialoguer = "0.12.0"
console = "0.16.2"
dirs = "6.0.0"
termtree = "1.0.0"
rustc-hash = "2.1.1"
itertools = "0.14.0"
symlink-rs = "1.0.0"